services:
  postgres:
    image: postgres:13.7-alpine
    container_name: bank-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    volumes:
      - bank_pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: bank-redis
    ports:
      - "6379:6379"

volumes:
  bank_pg_data:
